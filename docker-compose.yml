# The Postgres instance the `:postgres` tagged integration tests run against.
#
# The project name is pinned so that this file never adopts, restarts or
# removes a container started by anything else on the machine, and the port is
# well away from the default so that it cannot collide with one either.
#
#     docker compose up -d
#     mix test.integration
#     docker compose stop
name: ash_metrics

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ash_metrics_test
    ports:
      - "${ASH_METRICS_PG_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ash_metrics_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
